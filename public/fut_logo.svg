<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Outer gold ring -->
  <circle cx="200" cy="200" r="192" fill="#d4af37" stroke="#b8960f" stroke-width="2"/>
  
  <!-- Purple ring -->
  <circle cx="200" cy="200" r="180" fill="#4b0082" stroke="#d4af37" stroke-width="3"/>
  
  <!-- Gold/yellow band -->
  <circle cx="200" cy="200" r="168" fill="#d4af37" stroke="none"/>
  
  <!-- Blue band -->
  <circle cx="200" cy="200" r="155" fill="#1a3a8f" stroke="none"/>
  
  <!-- White inner circle background -->
  <circle cx="200" cy="200" r="143" fill="white" stroke="#d4af37" stroke-width="1.5"/>
  
  <!-- Inner decorative ring -->
  <circle cx="200" cy="200" r="135" fill="none" stroke="#333" stroke-width="1"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#d4af37" stroke-width="0.8"/>

  <!-- Central star/diamond shape -->
  <g transform="translate(200, 200)">
    <!-- Main 4-pointed star -->
    <path d="M0,-90 C10,-10 10,-10 90,0 C10,10 10,10 0,90 C-10,10 -10,10 -90,0 C-10,-10 -10,-10 0,-90 Z" 
          fill="none" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Inner star lines -->
    <path d="M0,-60 C6,-6 6,-6 60,0 C6,6 6,6 0,60 C-6,6 -6,6 -60,0 C-6,-6 -6,-6 0,-60 Z" 
          fill="none" stroke="#333" stroke-width="1" stroke-linejoin="round"/>
    <!-- Central sunburst -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#333" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#666" stroke-width="0.5"/>
    <!-- Sunburst rays -->
    <line x1="0" y1="-18" x2="0" y2="-10" stroke="#333" stroke-width="0.7"/>
    <line x1="18" y1="0" x2="10" y2="0" stroke="#333" stroke-width="0.7"/>
    <line x1="0" y1="18" x2="0" y2="10" stroke="#333" stroke-width="0.7"/>
    <line x1="-18" y1="0" x2="-10" y2="0" stroke="#333" stroke-width="0.7"/>
    <line x1="13" y1="-13" x2="7" y2="-7" stroke="#333" stroke-width="0.5"/>
    <line x1="13" y1="13" x2="7" y2="7" stroke="#333" stroke-width="0.5"/>
    <line x1="-13" y1="-13" x2="-7" y2="-7" stroke="#333" stroke-width="0.5"/>
    <line x1="-13" y1="13" x2="-7" y2="7" stroke="#333" stroke-width="0.5"/>
  </g>
  
  <!-- "MINNA" text at bottom of inner white area -->
  <text x="200" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="18" 
        font-weight="bold" fill="#111" letter-spacing="5">MINNA</text>
  
  <!-- Circular text "FEDERAL UNIVERSITY OF TECHNOLOGY" -->
  <path id="topArc" d="M 42,200 A 158,158 0 0,1 358,200" fill="none"/>
  <text font-family="Georgia, serif" font-size="16" font-weight="bold" fill="white" letter-spacing="2.2">
    <textPath href="#topArc" startOffset="2%">FEDERAL  UNIVERSITY  OF  TECHNOLOGY</textPath>
  </text>

  <!-- Bottom arc text (outside the white circle, on purple) -->
  <path id="bottomTextArc" d="M 40,210 A 160,160 0 0,0 360,210" fill="none"/>
  
  <!-- Motto text on gold band area -->
  <path id="mottoArc" d="M 80,328 A 150,150 0 0,0 320,328" fill="none"/>
  <text font-family="Georgia, serif" font-size="13" font-style="italic" fill="#111" letter-spacing="1">
    <textPath href="#mottoArc" startOffset="8%">Technology for Empowerment</textPath>
  </text>

  <!-- Blue water drops / decorative elements at base -->
  <ellipse cx="78" cy="348" rx="14" ry="22" fill="#007bff" opacity="0.85" transform="rotate(-20, 78, 348)"/>
  <ellipse cx="322" cy="348" rx="14" ry="22" fill="#007bff" opacity="0.85" transform="rotate(20, 322, 348)"/>
</svg>
